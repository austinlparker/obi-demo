# Global datasources. Perses' server proxies the requests, so the browser
# never needs to reach Prometheus or Jaeger directly.
- kind: GlobalDatasource
  metadata:
    name: prometheus
  spec:
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://prometheus:9090
- kind: GlobalDatasource
  metadata:
    name: jaeger
  spec:
    default: true
    plugin:
      kind: JaegerDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://jaeger:16686
