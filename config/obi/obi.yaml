# OBI v1 configuration (Config v2 schema, OpenTelemetry declarative config shape).
# Validate with:  make validate
#   (runs: obi config validate /path/to/obi.yaml in the otel/ebpf-instrument:v1.0.0 image)
#
# docker-compose.yaml runs OBI privileged for simplicity. To drop privileged,
# OBI's security docs list what this config needs:
#   application observability: CAP_BPF CAP_PERFMON CAP_DAC_READ_SEARCH
#                              CAP_CHECKPOINT_RESTORE CAP_NET_RAW CAP_SYS_PTRACE
#   context propagation:       + CAP_NET_ADMIN, and CAP_SYS_ADMIN for Go
#                              library-level propagation
#   network flow metrics:      CAP_BPF CAP_NET_RAW (socket filter)
file_format: "1.0"
log_level: info

# Where OBI sends telemetry. OBI runs on the VM's host network, so the
# Collector is reached on the port it publishes on the VM's loopback.
meter_provider:
  readers:
    - periodic:
        interval: 15000
        exporter:
          otlp_http:
            endpoint: http://127.0.0.1:4318/v1/metrics
            default_histogram_aggregation: explicit_bucket_histogram
tracer_provider:
  processors:
    - batch:
        schedule_delay: 1000
        exporter:
          otlp_http:
            endpoint: http://127.0.0.1:4318/v1/traces

extensions:
  obi:
    version: "2.0"

    # How OBI names the other end of a connection (service graph client/server,
    # server.address). The default source is Kubernetes. Here, "dns" means a
    # reverse lookup of the peer IP, answered by the extra_hosts entries on the
    # obi service in docker-compose.yaml. Peers it can't name show up as
    # "incoming" or "outgoing".
    enrich:
      service_name:
        sources: [dns]

    # Which processes to instrument. Only the swag shop's own services are
    # selected, by the port each one listens on. Everything else on the VM
    # (Postgres, Redis, NATS, the Collector, Jaeger, Prometheus, Perses, k6)
    # is left alone, but still shows up as the far end of client spans.
    capture:
      policy:
        default_action: exclude
        match_order: first_match_wins
      rules:
        - action: include
          name: gateway
          description: Go API gateway
          match:
            process:
              open_ports: "8088"
        - action: include
          name: catalog
          description: Python FastAPI catalog
          match:
            process:
              open_ports: "8000"
        - action: include
          name: cart
          description: Node.js cart
          match:
            process:
              open_ports: "3000"
        - action: include
          name: checkout
          description: Java gRPC checkout
          match:
            process:
              open_ports: "50051"
        - action: include
          name: notifier
          description: Rust NATS consumer
          match:
            process:
              open_ports: "7070"

      instrumentation:
        http:
          routes:
            incoming:
              unmatched: heuristic
              patterns:
                - /api/products/{sku}
                - /api/cart/{user}
                - /api/cart/{user}/items
                - /api/checkout/{user}
                - /admin/chaos/{service}
                - /products/{sku}
                - /products/{sku}/sold
                - /cart/{user}
                - /cart/{user}/items
            outgoing:
              unmatched: heuristic
              patterns:
                - /products/{sku}
                - /products/{sku}/sold
                - /cart/{user}
                - /cart/{user}/items
                - /admin/chaos

          # Header and body capture, as span attributes: http.request.header.<name>,
          # http.response.header.<name>, http.request.body.content and
          # http.response.body.content. Nothing is captured unless a rule says so.
          # Headers use the first matching rule; for bodies, exclude beats
          # obfuscate beats include. Spans only: the Collector's spanmetrics
          # dimensions are fixed, so none of this reaches metric labels.
          buffer_size: 8192          # default capture cuts off after the first few headers
          payload_extraction:
            enabled: [enrichment]
            enrichment:
              policy:
                default_action:
                  headers: exclude
                  body: exclude
                obfuscation_string: "***"
              rules:
                # Header patterns must be lowercase. With case_sensitive: false,
                # OBI v1.0.0 lowercases the header name but, when the config is
                # Config v2, not the pattern, so "Content-Type" never matches.
                #
                # Browsers send every localhost cookie to localhost:8080,
                # including ones from other local apps. Record that one was
                # sent, never its value.
                - action: obfuscate
                  type: headers
                  scope: all
                  match:
                    patterns: [cookie, set-cookie, authorization]
                    case_sensitive: false
                # X-Order-Id is set by the gateway on checkout responses, so an
                # order ID from the UI or the notifier's log finds its trace.
                - action: include
                  type: headers
                  scope: all
                  match:
                    patterns: [user-agent, content-type, x-order-id]
                    case_sensitive: false
                # The small write payloads. GET responses (the product list) stay out.
                - action: include
                  type: body
                  scope: all
                  match:
                    methods: [POST]
                    url_path_patterns:
                      - /api/cart/*/items
                      - /cart/*/items
                      - /api/checkout/*
                      - /products/*/sold
                      - /admin/chaos*

      # Network flow and TCP stats metrics, captured on the VM's interfaces.
      network:
        capture:
          enabled: true
          # Despite living here, this is the payload capture size for protocols
          # OBI parses from generic TCP, NATS included (ebpf.buffer_sizes.tcp in
          # v1). The default 0 leaves only 256 request / 128 response bytes, which
          # truncates most order messages, and the NATS parser drops truncated frames.
          buffer_size: 4096
        stats:
          enabled: true

      metrics:
        features:
          - application              # RED metrics for HTTP, gRPC, SQL, Redis, NATS
          - application_service_graph
          - application_runtime      # experimental: Go, Java, Node.js runtime metrics
          - network
          - stats

      # W3C traceparent propagation for HTTP/1, plaintext HTTP/2 and gRPC,
      # plus Go library-level propagation (needs privileged / CAP_SYS_ADMIN).
      engine:
        propagation:
          context_propagation: all
