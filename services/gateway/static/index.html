<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swag Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1b1b1f; }
    h1 { margin-bottom: .25rem; }
    p.sub { color: #5c5c66; margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; border-bottom: 1px solid #e4e4ea; }
    button { font: inherit; padding: .35rem .8rem; border-radius: 6px; border: 1px solid #3d5afe; background: #3d5afe; color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: #3d5afe; }
    #status { margin-top: 1rem; min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Swag Shop</h1>
  <p class="sub">Five services, five languages, zero instrumentation code. OBI does the rest.</p>
  <ul id="products"></ul>
  <button id="checkout">Check out</button>
  <button id="view" class="secondary">View cart</button>
  <div id="status"></div>
  <script>
    const user = 'browser-' + Math.random().toString(36).slice(2, 8);
    const status = (msg) => { document.getElementById('status').textContent = msg; };
    const money = (c) => '$' + (c / 100).toFixed(2);

    async function api(method, path, body) {
      const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function load() {
      const products = await api('GET', '/api/products');
      const list = document.getElementById('products');
      list.innerHTML = '';
      for (const p of products) {
        const li = document.createElement('li');
        li.innerHTML = `<span>${p.name} <small>(${p.stock} left)</small></span>`;
        const btn = document.createElement('button');
        btn.textContent = 'Add ' + money(p.price_cents);
        btn.onclick = async () => {
          try { await api('POST', `/api/cart/${user}/items`, { sku: p.sku, quantity: 1 }); status(`Added ${p.name}`); }
          catch (e) { status('Error: ' + e.message); }
        };
        li.appendChild(btn);
        list.appendChild(li);
      }
    }

    document.getElementById('checkout').onclick = async () => {
      try { const o = await api('POST', `/api/checkout/${user}`); status(`Order ${o.order_id} placed, ${money(o.total_cents)}`); load(); }
      catch (e) { status('Error: ' + e.message); }
    };
    document.getElementById('view').onclick = async () => {
      try { const items = await api('GET', `/api/cart/${user}`); status(items.length ? items.map(i => `${i.quantity} x ${i.sku}`).join(', ') : 'Cart is empty'); }
      catch (e) { status('Error: ' + e.message); }
    };
    load().catch(e => status('Error: ' + e.message));
  </script>
</body>
</html>
