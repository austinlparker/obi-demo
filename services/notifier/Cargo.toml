[package]
name = "notifier"
version = "1.0.0"
edition = "2024"
description = "Notifier for the OBI demo: consumes orders from NATS and updates stock in the catalog."
publish = false

[dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "time"] }
async-nats = "0.52"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Plain HTTP only, so no TLS stack is pulled in.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
rand = "0.10"

[profile.release]
# Keep symbols so stack traces and profilers stay useful.
strip = false
